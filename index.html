<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyle Reader - AI Insight</title>
    
    <!-- Favicon: Blue Rounded Square with White Book -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='0' y='0' width='100' height='100' rx='25' fill='%234F46E5'/%3E%3Cpath d='M25 30v40c0 0 15 5 25 5s25-5 25-5v-40c0 0-15 5-25 5s-25-5-25-5z' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='50' y1='35' x2='50' y2='80' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF.js & Epub.js Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    
    <script>
      // Cấu hình Tailwind
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['Bookerly', 'Merriweather', 'Georgia', 'serif'],
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              sepia: {
                50: '#fbf0d9',
                100: '#f7e8c3',
                900: '#5f4b32',
              }
            }
          }
        }
      }

      // Cấu hình Worker cho PDF.js
      document.addEventListener('DOMContentLoaded', () => {
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
      });
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Bookerly';
            src: local('Bookerly'), local('Bookerly Regular'), url('https://cdn.jsdelivr.net/gh/cw1427/fonts/Bookerly/Bookerly-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .insight-content h1 { font-size: 2.5rem; font-weight: 800; line-height: 1.2; margin-bottom: 1.5rem; }
        .insight-content h2 { font-size: 1.5rem; font-weight: 700; color: #6366f1; margin-top: 2rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .insight-content blockquote { border-left: 4px solid #6366f1; padding-left: 1.5rem; font-style: italic; font-size: 1.25rem; margin: 2rem 0; color: #94a3b8; }
        .dark .insight-content blockquote { color: #cbd5e1; }
        .insight-content p { line-height: 1.8; margin-bottom: 1.25rem; font-size: 1.1rem; }
        
        /* Custom Scrollbar */
        .reader-scroll::-webkit-scrollbar { width: 8px; }
        .reader-scroll::-webkit-scrollbar-track { background: transparent; }
        .reader-scroll::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        .reader-scroll::-webkit-scrollbar-thumb:hover { background-color: rgba(156, 163, 175, 0.8); }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
